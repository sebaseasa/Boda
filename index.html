<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20261a">
  <title>Boda Sebas &amp; Caro · Simulador</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="stage"></div>

  <div id="carga">
    <div class="carga-titulo">Sebas &amp; Caro</div>
    <div class="carga-barra"><i id="carga-progreso"></i></div>
    <div id="carga-texto">Cargando 0%</div>
  </div>

  <nav id="vistas" aria-label="Vistas"></nav>

  <div id="hora-panel">
    <div id="arcos" role="group" aria-label="Tipo de arco"></div>
    <div class="hora-fila">
      <span class="hora-etiqueta">Hora</span>
      <span id="hora-valor">5:50 pm</span>
    </div>
    <input id="hora" type="range" aria-label="Hora del día">
  </div>

  <div id="fps" hidden></div>
  <a id="creditos" href="https://github.com/sebaseasa/Boda/blob/main/CREDITOS.md" target="_blank" rel="noopener">Créditos</a>

  <div id="error" hidden>Tu navegador no pudo iniciar el 3D (WebGL). Prueba en Chrome actualizado.</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
