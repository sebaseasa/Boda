<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sebas & Caro, simulador de la boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Figtree:wght@400;500;650&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ede4;--surface:#fbf9f4;--ink:#2c3524;--muted:#6f7464;--line:#ddd6c7;
  --chip:#efe9dd;--accent:#4f6339;--accent-ink:#ffffff;--heart:#b5546d;--ok:#4f6339;--gold:#a8853f;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14170f;--surface:#1b1f15;--ink:#ece8dc;--muted:#a3a593;--line:#323827;
    --chip:#232a1b;--accent:#a9bd8a;--accent-ink:#14170f;--heart:#e98aa2;--ok:#a9bd8a;--gold:#d6b46f;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14170f;--surface:#1b1f15;--ink:#ece8dc;--muted:#a3a593;--line:#323827;
  --chip:#232a1b;--accent:#a9bd8a;--accent-ink:#14170f;--heart:#e98aa2;--ok:#a9bd8a;--gold:#d6b46f;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
header{padding:6px 16px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;font-weight:400;font-size:2rem;line-height:1.1;margin:0;color:var(--accent)}
#date{color:var(--gold);font-size:.85rem;font-weight:650;letter-spacing:.04em}
#sum{color:var(--muted);font-size:.82rem;flex-basis:100%;margin-top:-2px}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 55%;min-height:240px;overflow:hidden;background:#d9b48c}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;font:500 .82rem Figtree,system-ui,sans-serif;background:rgba(251,249,244,.88);color:#2c3524;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.views button.on{background:#2c3524;color:#fff}
#play{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:999px;padding:11px 20px;font:650 .95rem Figtree,system-ui,sans-serif;background:#fbf9f4;color:#2c3524;box-shadow:0 6px 24px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
#play:disabled{opacity:.6}
#clock{position:absolute;right:12px;bottom:18px;background:rgba(20,24,15,.7);color:#fff;border-radius:10px;padding:4px 10px;font:650 .85rem Figtree,system-ui,sans-serif}
#toast{position:absolute;left:50%;top:56px;transform:translate(-50%,-8px);background:rgba(28,34,20,.9);color:#fff;padding:9px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:88%}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{flex:0 0 auto;max-height:46%;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line)}
.bar{display:flex;gap:8px;padding:10px 14px 6px}
.bar button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:9px 10px;font:650 .88rem Figtree,system-ui,sans-serif;cursor:pointer}
.bar button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
nav.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:10px 10px 9px;font:500 .9rem Figtree,system-ui,sans-serif;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#tabbody{overflow-y:auto;padding:12px 14px 16px;flex:1;min-height:0}
.grp{margin-bottom:14px}
.lbl{font-weight:650;font-size:.88rem;margin-bottom:7px}
.hint{color:var(--muted);font-size:.8rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 .87rem Figtree,system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.pal{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:8px 10px;font:500 .85rem Figtree,system-ui,sans-serif;cursor:pointer}
.pal.on{outline:2px solid var(--accent);outline-offset:-1px}
.sw{display:flex;flex:0 0 auto}
.sw i{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:1.5px solid var(--surface)}
.sw i:first-child{margin-left:0}
.tg{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:10px 0;font:500 .9rem Figtree,system-ui,sans-serif;cursor:pointer;text-align:left}
.sw2{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on .sw2{background:var(--accent)}
.tg.on .sw2::after{transform:translateX(17px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:1.5rem;font-weight:650}
.steps{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.step{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border:0;background:none;color:var(--ink);text-align:left;padding:9px 8px;border-radius:10px;font:500 .9rem Figtree,system-ui,sans-serif;cursor:pointer}
.step .tm{color:var(--gold);font-weight:650;font-size:.82rem}
.step.on{background:var(--chip)}
.run{width:100%;border:0;border-radius:12px;padding:11px;background:var(--accent);color:var(--accent-ink);font:650 .92rem Figtree,system-ui,sans-serif;cursor:pointer}
.card{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;background:var(--chip)}
.card.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.card .top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.card .name{font-weight:650;flex:1}
.card .desc{color:var(--muted);font-size:.82rem;margin-bottom:9px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 .82rem Figtree,system-ui,sans-serif;cursor:pointer}
.card .acts button.h.on{background:var(--heart);color:#fff;border-color:transparent}
.badge{background:var(--ok);color:var(--surface);font-size:.75rem;font-weight:650;border-radius:999px;padding:2px 9px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:#2c3524}
@media (min-width:900px){
  .app{flex-direction:row}
  #stage{flex:1}
  #panel{max-height:none;width:390px;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){#toast,.sw2,.sw2::after{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Sebas &amp; Caro</h1>
  <div id="date">20 de febrero de 2027</div>
  <div id="sum"></div>
</header>
<div class="app">
  <div id="stage">
    <div class="views" id="views"></div>
    <button id="play">▶ Entrada de la novia</button>
    <div id="clock"></div>
    <div id="toast"></div>
    <div id="err">No se pudo iniciar el 3D en este dispositivo. Prueba abrirlo desde otro navegador o desde la compu.</div>
  </div>
  <aside id="panel">
    <div class="bar">
      <button class="primary" id="save">♥ Guardar esta opción</button>
      <button id="rand">🎲 Al azar</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div id="tabbody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const RX=30, ARCHZ=-14, LX=13, LZ=9;
const TREE={x:-4,z:-19.5}, PALM={x:5.5,z:-18.8};

/* ---------- Opciones ---------- */
const PALS=[
 {id:'sebascaro',name:'Beige, verde y dorado',flowers:[0xffffff,0xf8f5ee,0xfbf9f3,0xf3efe4],gyp:0xd2b46a,accent:0x55693f,cloth:0xf1ebdf,runner:0xe6dccb,sash:0xf1e9d8,metal:0xc9a24a,napkin:0x93a66c,goblet:0x8f9f62,ribbon:0x95a57e},
 {id:'salvia',name:'Blanco y verde salvia',flowers:[0xffffff,0xf2efe6,0xe3ead8,0xfaf6ee],gyp:0xffffff,accent:0x9cae8c,cloth:0xf7f6f0,runner:0xf2f0e9,sash:0xe3ead8,metal:0xe2ddd0,napkin:0x9cae8c,goblet:0xe8eef0,ribbon:0xb7c4a8},
 {id:'rosa',name:'Rosa palo y dorado',flowers:[0xf2c2bd,0xfbe2de,0xffffff,0xe5a29d],gyp:0xd2b46a,accent:0xc9a24a,cloth:0xfff5f3,runner:0xffffff,sash:0xefb9b3,metal:0xc9a24a,napkin:0xefb9b3,goblet:0xf3d3cf,ribbon:0xf2c9c4},
 {id:'terra',name:'Terracota y crema',flowers:[0xc56a40,0xe8b38c,0xf5e6cf,0xa64c2c],gyp:0xf5e6cf,accent:0xc56a40,cloth:0xf5ecdd,runner:0xe8d5bb,sash:0xe8b38c,metal:0xb98a55,napkin:0xc56a40,goblet:0xd9a27c,ribbon:0xd28a62},
 {id:'azul',name:'Azul polvo y plata',flowers:[0xa7bfd8,0xdae5f0,0xffffff,0x7d9aba],gyp:0xffffff,accent:0xb8bec6,cloth:0xf2f5f8,runner:0xdae5f0,sash:0xa7bfd8,metal:0xc4cad2,napkin:0xa7bfd8,goblet:0xc8d8e8,ribbon:0xb9cbdd},
 {id:'vino',name:'Vino y dorado',flowers:[0x7b1e2e,0xa33a4a,0xe8c9a0,0x56121f],gyp:0xd2b46a,accent:0xc9a24a,cloth:0xf5efe6,runner:0x7b1e2e,sash:0x7b1e2e,metal:0xc9a24a,napkin:0x7b1e2e,goblet:0x8a2a3a,ribbon:0x8b2c3c}
];
const CHAIRS=[['crossback','Crossback de madera'],['tiffany','Tiffany dorada con faja'],['plegable','Plegable blanca']];
const OPTS={
 cerChair:{label:'Sillas de la ceremonia',items:CHAIRS},
 recChair:{label:'Sillas de la recepción',items:CHAIRS},
 arch:{label:'Arco del altar',items:[['jardin','Arco de jardín'],['circular','Circular'],['hexagonal','Hexagonal'],['madera','Madera con telas'],['columnas','Columnas de flores']]},
 aisle:{label:'Pasillo',items:[['piedra','Camino de piedra'],['alfombra','Alfombra'],['cesped','Solo césped']]},
 layout:{label:'Tipo de mesas',items:[['redondas','Redondas de 10'],['imperial','Imperiales de madera'],['mixta','Mixta']]}
};
const TOGGLES={petals:'Pétalos en el pasillo',lanterns:'Faroles en el pasillo',sign:'Letrero de bienvenida',dance:'Pista de baile',lounge:'Lounge con fogata',tent:'Plan B: carpa sobre la recepción',lights:'Luces colgantes en la recepción',treeLights:'Faroles colgando del árbol grande'};
const DEF={pal:'sebascaro',cerChair:'crossback',recChair:'tiffany',arch:'jardin',aisle:'piedra',petals:true,lanterns:true,sign:true,guests:40,layout:'redondas',dance:false,lounge:true,tent:false,hour:17.83,lights:true,treeLights:true};
const STEPS=[
 {h:15,t:'3:00 pm',n:'Bienvenida',v:'bienvenida'},
 {h:16,t:'4:00 pm',n:'Ceremonia civil',v:'civil'},
 {h:16.5,t:'4:30 pm',n:'Ceremonia espiritual',v:'ceremonia',walk:true},
 {h:17.83,t:'5:50 pm',n:'Beso de casados al atardecer',v:'beso'},
 {h:18,t:'6:00 pm',n:'Fotos en el árbol grande',v:'arbol',couple:'arbol'},
 {h:19,t:'7:00 pm',n:'Cena de 3 tiempos',v:'mesa'},
 {h:20,t:'8:00 pm',n:'Brindis y despedida',v:'lounge'}
];
let cfg=Object.assign({},DEF);
const hex=c=>'#'+c.toString(16).padStart(6,'0');
const pal=()=>PALS.find(p=>p.id===cfg.pal)||PALS[0];
const labelOf=(k,v)=>(OPTS[k].items.find(i=>i[0]===v)||['',v])[1];
const fmtH=h=>{const H=Math.floor(h+1e-6),m=Math.round((h-H)*60);const hh=H>12?H-12:H;return `${hh}:${String(m%60).padStart(2,'0')} ${H>=12?'pm':'am'}`;};

/* ---------- Escena ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){$('#err').style.display='flex';return;}
const stage=$('#stage');
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,1,0.05,700);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI/2.04;controls.minDistance=.8;controls.maxDistance=120;

const hemi=new THREE.HemisphereLight(0xffffff,0x4a6b3a,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;
const sm=window.innerWidth<700?1024:2048;sun.shadow.mapSize.set(sm,sm);
Object.assign(sun.shadow.camera,{left:-44,right:44,top:44,bottom:-44,near:1,far:240});sun.shadow.bias=-0.0006;
sun.target.position.set(14,0,-3);scene.add(sun);scene.add(sun.target);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(7,20,14),new THREE.MeshBasicMaterial({color:0xffd9a0,fog:false}));scene.add(sunDisc);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(a,r)=>a[Math.floor(r()*a.length)];

/* Césped de la finca */
(function(){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  x.fillStyle='#6a8644';x.fillRect(0,0,256,256);const r=rng(3);
  for(let i=0;i<8000;i++){const dry=r()<.35;x.fillStyle=dry?`rgba(${150+r()*40|0},${140+r()*30|0},${90+r()*20|0},.45)`:`rgba(${70+r()*40|0},${110+r()*60|0},${40+r()*25|0},.55)`;x.fillRect(r()*256,r()*256,1+r()*1.5,1+r()*3);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(80,80);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(380,380),new THREE.MeshStandardMaterial({map:t,roughness:1}));
  g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
})();
/* Montañas lejanas */
(function(){
  const r=rng(21),m=new THREE.MeshStandardMaterial({color:0x5d6b78,roughness:1,flatShading:true});
  for(let i=0;i<34;i++){const a=i/34*Math.PI*2+r()*.1,d=180+r()*60,h=24+r()*55;
    const c=new THREE.Mesh(new THREE.ConeGeometry(30+r()*30,h,5),m);c.position.set(14+Math.cos(a)*d,h/2-2,Math.sin(a)*d);c.rotation.y=r()*6;scene.add(c);}
})();
/* Árbol grande, palmera, seto y árboles de fondo (como en las fotos del lugar) */
const leafMs=[0x3d6a2e,0x4b7a35,0x335b28,0x557f3a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.95,flatShading:true}));
(function(){
  const r=rng(5),bark=new THREE.MeshStandardMaterial({color:0x5b4a3c,roughness:1});
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2+r()*.5,tilt=.22+r()*.2,len=4.4+r()*1.4;
    const m=new THREE.Mesh(new THREE.CylinderGeometry(.13,.28,len,8),bark);
    m.position.set(TREE.x+Math.cos(a)*Math.sin(tilt)*len/2,len/2*Math.cos(tilt),TREE.z+Math.sin(a)*Math.sin(tilt)*len/2);
    m.rotation.set(Math.sin(a)*tilt,0,-Math.cos(a)*tilt);m.castShadow=true;scene.add(m);}
  const blob=new THREE.IcosahedronGeometry(1,1);
  for(const [mi,n] of [[0,32],[3,26]]){const im=new THREE.InstancedMesh(blob,leafMs[mi],n),mx=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
    for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r());const s=1.7+r()*1.2;e.set(r(),r(),r());q.setFromEuler(e);
      mx.compose(new THREE.Vector3(TREE.x+Math.cos(a)*d*6.5,5.6+r()*2.6-d*1.2,TREE.z+Math.sin(a)*d*5.5),q,new THREE.Vector3(s*1.3,s*.75,s*1.2));im.setMatrixAt(i,mx);}
    im.castShadow=true;scene.add(im);}
  // palmera
  const pt=new THREE.MeshStandardMaterial({color:0x6e5e4c,roughness:1});
  for(let i=0;i<6;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,1.05,9),pt);c.position.set(PALM.x+i*.05,.5+i*1,PALM.z);c.castShadow=true;scene.add(c);}
  const top=new THREE.Vector3(PALM.x+.3,6.1,PALM.z);
  const fg=new THREE.PlaneGeometry(.55,3.3);fg.translate(0,1.65,0);
  const fm=new THREE.MeshStandardMaterial({color:0x8d9e6c,roughness:.9,side:THREE.DoubleSide}),dm=new THREE.MeshStandardMaterial({color:0xa58a5c,roughness:1,side:THREE.DoubleSide});
  for(let i=0;i<30;i++){const dead=i>=22,f=new THREE.Mesh(fg,dead?dm:fm);f.position.copy(top);if(dead)f.position.y-=.3;
    f.rotation.order='YXZ';f.rotation.y=i*2.4;f.rotation.x=dead?2.75+r()*.2:.8+r()*1.1;f.castShadow=true;scene.add(f);}
  // seto y árboles medianos detrás
  const bush=new THREE.IcosahedronGeometry(1,1);
  for(let i=0;i<34;i++){const b=new THREE.Mesh(bush,pick(leafMs,r)),s=1+r()*.7;b.scale.set(s*1.4,s,s);b.position.set(-22+i*1.35,.7*s,-25-r()*1.2);b.castShadow=true;scene.add(b);}
  const trunkG=new THREE.CylinderGeometry(.14,.24,2.2,7),canG=new THREE.IcosahedronGeometry(1.8,1),pineG=new THREE.ConeGeometry(1.5,4.6,8),trunkM=new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1});
  const spots=[];for(let i=0;i<54;i++){const a=r()*Math.PI*2,rad=38+r()*34;spots.push([14+Math.cos(a)*rad*1.1,-2+Math.sin(a)*rad*.95]);}
  spots.push([-10,-14],[-12,-5],[9,-21],[-15,-20],[20,-20]);
  for(const [x,z] of spots){const s=.8+r()*.9,t=new THREE.Mesh(trunkG,trunkM);t.scale.setScalar(s);t.position.set(x,1.1*s,z);t.castShadow=true;scene.add(t);
    const pine=r()<.4,c=new THREE.Mesh(pine?pineG:canG,pick(leafMs,r));c.scale.set(s,s*(pine?1:.9),s);c.position.set(x,pine?4.2*s:3.3*s,z);c.rotation.y=r()*6;c.castShadow=true;scene.add(c);}
})();

/* Personas */
const skinM=new THREE.MeshStandardMaterial({color:0xd6a585,roughness:.8}),hairM=new THREE.MeshStandardMaterial({color:0x2a1d15,roughness:.9});
function m3(g,m,x,y,z,p){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function makeBride(){
  const g=new THREE.Group(),w=new THREE.MeshStandardMaterial({color:0xfbf8f1,roughness:.55});

let tab='experiencia';
const TABS=[['experiencia','La experiencia'],['estilo','Estilo'],['ceremonia','Ceremonia'],['recepcion','Recepción'],['ambiente','Ambiente'],['guardadas','Guardadas']];
function chips(k){return `<div class="grp"><div class="lbl">${OPTS[k].label}</div><div class="chips">${OPTS[k].items.map(([v,l])=>`<button class="chip ${cfg[k]===v?'on':''}" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`;}
function toggles(ks){return `<div class="grp">${ks.map(k=>`<button class="tg ${cfg[k]?'on':''}" data-k="${k}" data-b="1"><span>${TOGGLES[k]}</span><span class="sw2"></span></button>`).join('')}</div>`;}
function swatch(P){return `<span class="sw">${[P.cloth,P.napkin,P.accent,P.metal].map(c=>`<i style="background:${hex(c)}"></i>`).join('')}</span>`;}
function palettes(){return `<div class="grp"><div class="lbl">Paleta de colores</div><div class="pals">${PALS.map(P=>`<button class="pal ${cfg.pal===P.id?'on':''}" data-k="pal" data-v="${P.id}">${swatch(P)}<span>${P.name}</span></button>`).join('')}</div><div class="hint">La primera es la de su moodboard y la prueba de mesa: mantel marfil, plato base dorado, servilleta y copa verde, rosas blancas.</div></div>`;}
function guestsUI(){return `<div class="grp"><div class="lbl">Invitados</div><div class="big" id="gv">${cfg.guests}</div><input type="range" id="gs" min="20" max="150" step="5" value="${cfg.guests}" aria-label="Número de invitados"><div class="hint">Con este número: ${Math.ceil(cfg.guests/10)} filas en la ceremonia y ${REC.desc||''} en la recepción.</div></div>`;}
function hourUI(){return `<div class="grp"><div class="lbl">Hora</div><div class="big" id="hv">${fmtH(cfg.hour)}</div><input type="range" id="hs" min="15" max="21" step="0.0833" value="${cfg.hour}" aria-label="Hora del evento"><div class="hint">Mueve la hora y mira cómo cae la luz en el jardín, del sol de la tarde a la noche con faroles.</div></div>`;}
function expUI(){return `<div class="steps">${STEPS.map((s,i)=>`<button class="step ${i===curStep?'on':''}" data-s="${i}"><span class="tm">${s.t}</span><span>${s.n}</span></button>`).join('')}</div><button class="run" id="runall" ${running?'disabled':''}>${running?'Recorriendo…':'▶ Recorrer toda la experiencia'}</button>`;}
function summary(c){const P=PALS.find(p=>p.id===c.pal)||PALS[0];return `${P.name}, ${labelOf('arch',c.arch||'jardin').toLowerCase()}, ${labelOf('aisle',c.aisle||'piedra').toLowerCase()}, ${c.guests} invitados, mesas ${labelOf('layout',c.layout||'redondas').toLowerCase()}${c.tent?', con carpa':''}`;}
function renderSummary(){$('#sum').textContent=`Boda íntima en el jardín, ${cfg.guests} invitados, ${REC.desc}`;}
let saved=[];try{saved=JSON.parse(localStorage.getItem('boda-opciones')||'[]');}catch(e){saved=[];}
function persist(){try{localStorage.setItem('boda-opciones',JSON.stringify(saved));}catch(e){}}
function savedTab(){
  if(!saved.length)return `<div class="empty">Todavía no hay opciones guardadas. Arma una combinación y toca ♥ Guardar esta opción. Cuando los dos marquen la misma, queda decidida.</div>`;
  return saved.map((s,i)=>{const P=PALS.find(p=>p.id===s.cfg.pal)||PALS[0],done=s.seba&&s.caro;
    return `<div class="card ${done?'done':''}"><div class="top">${swatch(P)}<span class="name">${s.name}</span>${done?'<span class="badge">Decidido 🎉</span>':''}</div><div class="desc">${summary(Object.assign({},DEF,s.cfg))}</div>
    <div class="acts"><button data-a="ver" data-i="${i}">Ver</button><button class="h ${s.seba?'on':''}" data-a="seba" data-i="${i}">♥ Seba</button><button class="h ${s.caro?'on':''}" data-a="caro" data-i="${i}">♥ Caro</button><button data-a="del" data-i="${i}" aria-label="Borrar ${s.name}">Borrar</button></div></div>`;}).join('');
}
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}${k==='guardadas'&&saved.length?` (${saved.length})`:''}</button>`).join('');}
function renderBody(){
  const b=$('#tabbody');
  b.innerHTML=tab==='experiencia'?expUI()
   :tab==='estilo'?palettes()+chips('cerChair')+chips('recChair')
   :tab==='ceremonia'?chips('arch')+chips('aisle')+toggles(['petals','lanterns','sign'])
   :tab==='recepcion'?guestsUI()+chips('layout')+toggles(['lounge','tent','dance'])
   :tab==='ambiente'?hourUI()+toggles(['lights','treeLights'])
   :savedTab();
  const gs=$('#gs');if(gs){gs.addEventListener('input',()=>{$('#gv').textContent=gs.value;});gs.addEventListener('change',()=>{cfg.guests=+gs.value;build();renderBody();});}
  const hs=$('#hs');if(hs)hs.addEventListener('input',()=>{cfg.hour=+hs.value;$('#hv').textContent=fmtH(cfg.hour);applyLight(cfg.hour);});
  const ra=$('#runall');if(ra)ra.addEventListener('click',runAll);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;renderTabs();renderBody();});
$('#tabbody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.id==='runall')return;
  if(b.dataset.s!==undefined){if(!running&&!tour)goStep(+b.dataset.s,false);return;}
  if(b.dataset.a){const i=+b.dataset.i,s=saved[i];
    if(b.dataset.a==='ver'){cfg=Object.assign({},DEF,s.cfg);build();toast(`Viendo ${s.name}`);}
    else if(b.dataset.a==='del')saved.splice(i,1);
    else{s[b.dataset.a]=!s[b.dataset.a];if(s.seba&&s.caro)toast(`¡${s.name} queda decidida! 🎉`);}
    persist();renderTabs();renderBody();return;}
  const k=b.dataset.k;if(!k)return;
  if(b.dataset.b)cfg[k]=!cfg[k];else cfg[k]=b.dataset.v;
  build();renderBody();
  if(['layout','dance','recChair','tent'].includes(k))setView(k==='recChair'?'mesa':'recepcion');
  else if(['arch','aisle','petals','lanterns','cerChair'].includes(k))setView('ceremonia');
  else if(k==='sign')setView('bienvenida');else if(k==='lounge')setView('lounge');else if(k==='treeLights')setView('arbol');
});
$('#save').addEventListener('click',()=>{const n=saved.length?Math.max(...saved.map(s=>+(s.name.match(/\d+/)||[0])[0]))+1:1;
  saved.push({name:`Opción ${n}`,cfg:Object.assign({},cfg),seba:false,caro:false});persist();renderTabs();if(tab==='guardadas')renderBody();toast(`Opción ${n} guardada en Guardadas`);});
$('#rand').addEventListener('click',()=>{const R=Math.random,p=a=>a[Math.floor(R()*a.length)];
  cfg.pal=p(PALS).id;for(const k of Object.keys(OPTS))cfg[k]=p(OPTS[k].items)[0];
  for(const k of Object.keys(TOGGLES))cfg[k]=k==='tent'||k==='dance'?R()>.7:R()>.25;
  build();renderBody();toast(`${pal().name}, ${labelOf('arch',cfg.arch).toLowerCase()}`);});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}

build();renderTabs();renderBody();setView('beso',true);resize();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!tour)build();});
})();
</script>
</body>
</html>
